################### MangoHud — tema moderno (CachyOS + AMD) ###################
# Fonte com logos: ¤ = AMD, ¥ = NVIDIA, ¦ = Intel, § = CachyOS
# Caminhos usam "~/" (o MangoHud expande para a home de qualquer usuário).
legacy_layout=0
horizontal
position=top-center
toggle_hud=Shift_R+F12
toggle_logging=Shift_L+F2

### Aparência
font_file=~/.config/MangoHud/fonts/MangoHUD-Brand-Bold.ttf
font_file_text=~/.config/MangoHud/fonts/MangoHUD-Brand-Bold.ttf
font_size=26
font_size_text=26
round_corners=16
background_color=0A1014
background_alpha=0.85
text_color=ECEFF4
text_outline
text_outline_color=000000
text_outline_thickness=1.0
horizontal_separator_color=1DD3B0
table_columns=3

### Sistema — CachyOS (o rótulo do bloco de FPS vira o selo da distro)
fps
fps_text=§ CachyOS
engine_color=1DD3B0
fps_limit_method=late
fps_limit=0

### GPU — Radeon RX 9060 XT
gpu_list=0
gpu_text=¤ RX 9060 XT
gpu_color=FF4D5A
gpu_stats
gpu_temp
gpu_load_change
gpu_load_value=50,90
gpu_load_color=7EE787,FFD166,FF5A5F
vram
vram_color=F78C9C

### CPU — Ryzen 5 5600
cpu_text=¤ RYZEN 5 5600
cpu_color=FF9F43
cpu_stats
cpu_temp
cpu_load_change
cpu_load_value=50,90
cpu_load_color=7EE787,FFD166,FF5A5F
ram
ram_color=FFC976

### Frametime
frame_timing
frametime_color=1DD3B0

### Relógio
time
time_no_label
time_format=%H:%M:%S

### Diversos
output_folder=~/.local/share/goverlay
log_interval=100
blacklist=zenity,protonplus,lsfg-vk-ui,bazzar,gnome-calculator,pamac-manager,lact,ghb,bitwig-studio,ptyxis,yumex
